<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark App Icon Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#06080e"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Electric Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b1a"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind Monogram -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#ff5500" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Drop Shadow for Icon Depth -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ff5500" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>
  
  <!-- Subtle Blueprint Grid Overlay -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#grid)" clip-path="url(#clipSquircle)"/>

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)"/>

  <!-- Top Terminal Bar Dots (Subtle Coder Detail) -->
  <circle cx="72" cy="72" r="8" fill="#ef4444" opacity="0.8"/>
  <circle cx="96" cy="72" r="8" fill="#f59e0b" opacity="0.8"/>
  <circle cx="120" cy="72" r="8" fill="#10b981" opacity="0.8"/>

  <!-- Geometric Code Corner Brackets -->
  <path d="M 72 130 L 52 150 L 72 170" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 440 130 L 460 150 L 440 170" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Monogram Group: I / E -->
  <g filter="url(#iconShadow)">
    <!-- Letter "I" -->
    <path d="M 125 185 L 185 185 M 155 185 L 155 335 M 125 335 L 185 335" 
          stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Electric Orange Divider Slash "/" -->
    <path d="M 292 165 L 220 355" 
          stroke="url(#orangeGrad)" stroke-width="34" stroke-linecap="round" fill="none"/>

    <!-- Letter "E" -->
    <path d="M 385 185 L 325 185 L 325 335 L 385 335 M 325 260 L 375 260" 
          stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Bottom Terminal Status Tag -->
  <rect x="176" y="408" width="160" height="28" rx="14" fill="rgba(255, 85, 0, 0.15)" stroke="rgba(255, 85, 0, 0.3)" stroke-width="1.5"/>
  <circle cx="196" cy="422" r="4.5" fill="#10b981"/>
  <text x="210" y="426" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ff5500" letter-spacing="2">ENGINE</text>

  <!-- Outer Border Glow Highlight -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#orangeGrad)" stroke-width="2" opacity="0.35"/>
</svg>
